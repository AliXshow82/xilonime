<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create account | Xilonimeh</title>
  <meta name="description" content="Create a Xilonimeh account to sync your anime list.">
  <meta name="theme-color" content="#07070a">
  <link rel="icon" href="assets/icon.ico">
  <link rel="stylesheet" href="assets/css/style.css?v=0.36.0">
</head>
<body class="auth-page" data-page="signup">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <div id="site-header"></div>

  <main>
    <form class="auth-card" id="signupForm">
      <p class="eyebrow" data-i18n="authEyebrow">Account</p>
      <h1 data-i18n="signupTitle">Create your account</h1>
      <p data-i18n="signupText">Your list is saved to your account and follows you to every device.</p>
      <div class="social-grid">
        <button class="social-auth-btn google-login-btn" id="siteGoogleBtn" type="button">
          <span class="google-g">G</span><span>Google</span>
        </button>
        <button class="social-auth-btn discord-login-btn" id="siteDiscordBtn" type="button">
          <span>Discord</span>
        </button>
      </div>
      <div class="auth-separator"><span></span><b data-i18n="authOr">or</b><span></span></div>
      <label for="signupName" data-i18n="authUsernameOnly">Username</label>
      <input type="text" id="signupName" placeholder="xilo_user" autocomplete="username" minlength="3" required>
      <label for="signupEmail" data-i18n="authEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
      <label for="signupPassword" data-i18n="authPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
      <button class="btn btn-primary" type="submit"><span data-i18n="signupButton">Create account</span></button>
      <a class="auth-link" href="login.html" data-i18n="signupSwitch">Already have an account? Sign in</a>
    </form>
  </main>

  <script type="module" src="assets/js/site.js?v=0.36.0"></script>
  <script type="module" src="assets/js/backdrop.js?v=0.36.0"></script>
</body>
</html>
